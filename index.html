<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para mi Princesa Ximena 🌻✨</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-light: #fef08a;
            --gold-base: #facc15;
            --gold-dark: #ca8a04;
            --space-bg: #020005;
            --stem-color: #22c55e;
            --neon-pink: #ff007f;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            background-color: var(--space-bg);
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: white;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            perspective: 2000px;
        }

        #universe-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        #ui-layer {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            transform-style: preserve-3d;
            pointer-events: none; /* Dejar pasar clicks al canvas si es necesario */
        }

        .interactive-element { pointer-events: auto; }

        #start-screen {
            position: fixed; inset: 0; background: transparent;
            z-index: 100; display: flex; align-items: center; justify-content: center;
            flex-direction: column; cursor: pointer; transition: opacity 1.5s ease, filter 1.5s ease;
            text-align: center; padding: 20px;
        }
        
        .romantic-intro {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3.5rem, 8vw, 6rem);
            color: #fff;
            text-shadow: 0 0 20px var(--gold-base), 0 0 40px var(--neon-pink), 0 0 80px rgba(255,255,255,0.8);
            animation: breathe 3s ease-in-out infinite;
            line-height: 1.2;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.85; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.03); }
        }
        @keyframes pulse-glow {
            0%, 100% { text-shadow: 0 0 20px var(--gold-base), 0 0 40px var(--gold-dark); }
            50% { text-shadow: 0 0 40px #fff, 0 0 80px var(--gold-base), 0 0 120px var(--gold-dark); }
        }

        #parallax-wrapper {
            position: absolute; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s linear;
        }

        #seed {
            position: absolute; top: -20px; left: 50%;
            width: 15px; height: 25px;
            background: radial-gradient(circle, #fff, var(--gold-base), #854d0e);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform: translateX(-50%);
            box-shadow: 0 0 20px var(--gold-base), 0 0 40px #fff;
            opacity: 0; z-index: 4;
            transition: top 1.5s cubic-bezier(0.5, 0, 1, 1), opacity 0.5s ease;
        }

        #stem-container {
            position: absolute; bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 8px; height: 0vh;
            background: linear-gradient(to top, #064e3b, var(--stem-color));
            border-radius: 4px 4px 0 0;
            z-index: 5;
            transition: height 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.8);
        }

        #heart-container {
            position: absolute; 
            top: 50%; left: 50%;
            width: 100vw; height: 100vh;
            transform: translate(-50%, -50%);
            z-index: 6; transform-style: preserve-3d;
            transition: all 2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Clases para mover el corazón a la derecha (Desktop) o arriba (Mobile) */
        .slide-right-desktop {
            left: 75% !important;
            transform: translate(-50%, -50%) scale(0.85) !important;
        }
        
        @media (max-width: 768px) {
            .slide-right-desktop {
                top: 25% !important; left: 50% !important;
                transform: translate(-50%, -50%) scale(0.6) !important;
            }
        }

        .flower-item {
            position: absolute;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; justify-content: center;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
        }

        #name-container {
            position: absolute; 
            top: 50%; left: 25%;
            transform: translate(-50%, -50%) scale(0.8);
            text-align: center;
            opacity: 0; z-index: 30;
            transition: all 2s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }
        
        @media (max-width: 768px) {
            #name-container {
                top: 70%; left: 50%;
            }
        }

        #name-container.active {
            opacity: 1; transform: translate(-50%, -50%) scale(1);
            pointer-events: auto; cursor: pointer;
        }

        .name-sun {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(5rem, 15vw, 12rem);
            color: #fff;
            text-shadow: 0 0 30px #fff, 0 0 60px var(--gold-light), 0 0 100px var(--gold-base), 0 0 150px var(--gold-dark);
            transition: transform 0.3s ease;
        }

        .name-sun:hover { transform: scale(1.05); }

        .click-hint {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: var(--gold-light);
            margin-top: 10px; letter-spacing: 3px; text-transform: uppercase;
            animation: pulse-glow 2s infinite alternate;
            text-shadow: 0 2px 10px rgba(0,0,0,1);
        }

        #final-scene {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; z-index: 20;
            transition: opacity 2s ease-in;
            transform-style: preserve-3d;
        }

        #message-panel {
            background: rgba(10, 5, 20, 0.7);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(250, 204, 21, 0.4);
            border-radius: 20px;
            padding: 30px; width: 90%; max-width: 800px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(250, 204, 21, 0.1);
            transform: translateZ(50px);
            z-index: 50;
        }

        #typing-text {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            line-height: 1.6; color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,1);
            min-height: 150px; /* Evitar saltos */
        }
        
        .cursor { display: inline-block; width: 10px; height: 1em; background: var(--gold-base); animation: blink 1s infinite; vertical-align: bottom; margin-left: 5px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        #timer-container {
            margin-top: 30px; padding-top: 20px;
            border-top: 1px solid rgba(250, 204, 21, 0.3);
        }
        
        .timer-title {
            font-family: 'Great Vibes', cursive;
            font-size: 2rem; color: var(--gold-light);
            margin-bottom: 15px; text-shadow: 0 0 10px var(--gold-base);
        }

        .timer-grid {
            display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;
        }

        .time-box {
            background: rgba(0,0,0,0.5); border: 1px solid var(--gold-dark);
            border-radius: 10px; padding: 10px 15px; min-width: 80px;
        }
        .time-value { font-size: 2rem; font-weight: bold; color: #fff; text-shadow: 0 0 15px var(--gold-base); }
        .time-label { font-size: 0.8rem; text-transform: uppercase; color: #aaa; letter-spacing: 1px; }

        #solar-system {
            position: absolute; inset: 0;
            pointer-events: none; transform-style: preserve-3d;
        }

        .planet {
            position: absolute; top: 50%; left: 50%;
            pointer-events: auto; cursor: pointer;
            display: flex; flex-direction: column; align-items: center;
            transform-style: preserve-3d;
        }

        .planet-bubble {
            background: rgba(15, 5, 25, 0.8);
            border: 1px solid var(--gold-base);
            border-radius: 30px; padding: 10px 20px; color: white;
            font-weight: 600; text-align: center; white-space: nowrap;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(250, 204, 21, 0.3);
            text-shadow: 0 2px 4px rgba(0,0,0,1);
            transition: transform 0.3s ease;
        }

        #flash-overlay {
            position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 99; transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>

    <div id="start-screen" class="interactive-element" onclick="startExperience()">
        <div class="romantic-intro">Toca la pantalla<br>mi princesa...</div>
        <div class="click-hint" style="animation: pulse-glow 2s infinite alternate;">Descubre tu universo 💖</div>
    </div>

    <!-- Canvas de Espacio -->
    <canvas id="universe-canvas"></canvas>

    <div id="ui-layer">
        <div id="parallax-wrapper">
            <!-- Animación inicial -->
            <div id="seed"></div>
            <div id="stem-container"></div>
            <div id="heart-container"></div>
            
            <!-- Mitad Izquierda (o abajo) -->
            <div id="name-container" onclick="triggerWarp()">
                <div class="name-sun">Ximena</div>
                <div class="click-hint">Toca aquí para empezar tu viaje</div>
            </div>

            <!-- Escena Final -->
            <div id="final-scene">
                <div id="solar-system"></div>
                <div id="message-panel" class="interactive-element">
                    <div id="typing-text"></div>
                    <div id="timer-container">
                        <div class="timer-title">Mi amor por ti comenzó el 12 de abril. Llevamos:</div>
                        <div class="timer-grid" id="timer-grid">
                            <!-- JS llenará esto -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Utilidades SVG avanzadas para gráficos impresionantes sin imágenes externas
        
        // 1. Girasol (Centro grande oscuro, pétalos dorados)
        function getGirasol(size = "100%") {
            let petals = '';
            for(let i=0; i<24; i++) {
                petals += `<path d="M50 35 C40 0, 60 0, 50 35" fill="url(#grad-gira)" transform="rotate(${i * 15} 50 50)"/>`;
            }
            return `
            <svg width="${size}" height="${size}" viewBox="0 0 100 100" style="overflow:visible">
                <defs>
                    <linearGradient id="grad-gira" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#fde047" />
                        <stop offset="100%" stop-color="#ca8a04" />
                    </linearGradient>
                </defs>
                <g filter="drop-shadow(0 5px 10px rgba(0,0,0,0.5))">
                    ${petals}
                    <circle cx="50" cy="50" r="18" fill="#422006"/>
                    <circle cx="50" cy="50" r="14" fill="none" stroke="#713f12" stroke-width="2" stroke-dasharray="2,2"/>
                    <circle cx="50" cy="50" r="8" fill="#271102"/>
                </g>
            </svg>`;
        }

        // 2. Tulipán (Forma de copa elegante)
        function getTulipan(size = "100%") {
            return `
            <svg width="${size}" height="${size}" viewBox="0 0 100 100" style="overflow:visible">
                <defs>
                    <linearGradient id="grad-tulip" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fef08a" />
                        <stop offset="50%" stop-color="#facc15" />
                        <stop offset="100%" stop-color="#a16207" />
                    </linearGradient>
                </defs>
                <g transform="translate(15, 10) scale(0.7)" filter="drop-shadow(0 5px 10px rgba(0,0,0,0.5))">
                    <path d="M10 90 C0 30, 20 0, 50 0 C80 0, 100 30, 90 90 C70 100, 30 100, 10 90 Z" fill="url(#grad-tulip)"/>
                    <path d="M25 95 C15 40, 35 10, 50 5 C65 10, 85 40, 75 95 Z" fill="#fef08a" opacity="0.9"/>
                    <path d="M50 100 C40 60, 45 20, 50 15 C55 20, 60 60, 50 100 Z" fill="#fde047"/>
                </g>
            </svg>`;
        }

        // 3. Margarita / Calendula (Centro amarillo, pétalos finos)
        function getMargarita(size = "100%") {
            let petals = '';
            for(let i=0; i<32; i++) {
                petals += `<path d="M50 40 C45 10, 55 10, 50 40" fill="#fef08a" transform="rotate(${i * 11.25} 50 50)"/>`;
            }
            return `
            <svg width="${size}" height="${size}" viewBox="0 0 100 100" style="overflow:visible">
                <g filter="drop-shadow(0 3px 6px rgba(0,0,0,0.4))">
                    ${petals}
                    <circle cx="50" cy="50" r="12" fill="#d97706"/>
                    <circle cx="50" cy="50" r="6" fill="#f59e0b"/>
                </g>
            </svg>`;
        }

        // 4. Lirio (Azucena - Pétalos anchos en estrella)
        function getLirio(size = "100%") {
            let petals = '';
            for(let i=0; i<6; i++) {
                petals += `<path d="M50 50 Q30 20 50 -10 Q70 20 50 50" fill="url(#grad-lirio)" transform="rotate(${i * 60} 50 50)"/>`;
            }
            return `
            <svg width="${size}" height="${size}" viewBox="0 0 100 100" style="overflow:visible">
                <defs>
                    <linearGradient id="grad-lirio" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#fef08a" />
                        <stop offset="100%" stop-color="#eab308" />
                    </linearGradient>
                </defs>
                <g filter="drop-shadow(0 4px 8px rgba(0,0,0,0.5))">
                    ${petals}
                    <!-- Estambres -->
                    ${Array.from({length:6}).map((_,i)=> `<line x1="50" y1="50" x2="50" y2="25" stroke="#a16207" stroke-width="2" transform="rotate(${i*60 + 30} 50 50)"/><circle cx="50" cy="25" r="3" fill="#713f12" transform="rotate(${i*60 + 30} 50 50)"/>`).join('')}
                </g>
            </svg>`;
        }

        // 5. Orquídea Phalaenopsis (Pétalos exóticos)
        function getOrquidea(size = "100%") {
            return `
            <svg width="${size}" height="${size}" viewBox="0 0 100 100" style="overflow:visible">
                <g filter="drop-shadow(0 5px 10px rgba(0,0,0,0.5))" fill="#fde047">
                    <!-- Pétalos traseros -->
                    <path d="M50 50 C20 0, 80 0, 50 50" />
                    <path d="M50 50 C-10 60, 20 110, 50 50" />
                    <path d="M50 50 C110 60, 80 110, 50 50" />
                    <!-- Pétalos laterales anchos -->
                    <path d="M50 50 Q-10 20 10 50 Q30 70 50 50" fill="#fef08a"/>
                    <path d="M50 50 Q110 20 90 50 Q70 70 50 50" fill="#fef08a"/>
                    <!-- Labelo (Centro) -->
                    <path d="M50 50 Q40 80 50 90 Q60 80 50 50" fill="#ca8a04"/>
                    <circle cx="50" cy="55" r="6" fill="#713f12"/>
                </g>
            </svg>`;
        }

        // 6. Ramo de Flores (Bouquet para la galaxia)
        function getRamo(size = "100%") {
            return `
            <svg width="${size}" height="${size}" viewBox="0 0 120 140" style="overflow:visible" filter="drop-shadow(0 15px 20px rgba(0,0,0,0.6))">
                <g transform="translate(0, 10)">
                    <!-- Hojas traseras -->
                    <path d="M60 80 Q20 30 10 60 Q40 90 60 100 Z" fill="#15803d"/>
                    <path d="M60 80 Q100 30 110 60 Q80 90 60 100 Z" fill="#166534"/>
                    
                    <!-- Envoltorio papel kraft premium -->
                    <path d="M30 75 L90 75 L75 140 L45 140 Z" fill="#d1d5db"/>
                    <path d="M15 75 Q60 110 105 75 L90 75 Q60 95 30 75 Z" fill="#f3f4f6"/>
                    
                    <!-- Flores dentro del ramo (Mezcla de nuestras funciones SVG) -->
                    <g transform="translate(10, 10) scale(0.4)">${getGirasol()}</g>
                    <g transform="translate(50, 5) scale(0.45)">${getGirasol()}</g>
                    <g transform="translate(25, -10) scale(0.35)">${getTulipan()}</g>
                    <g transform="translate(65, -5) scale(0.4)">${getLirio()}</g>
                    <g transform="translate(45, 30) scale(0.35)">${getMargarita()}</g>
                    
                    <!-- Lazo brillante -->
                    <path d="M60 90 Q35 80 40 105 Q55 105 60 90 Z" fill="#ff007f"/>
                    <path d="M60 90 Q85 80 80 105 Q65 105 60 90 Z" fill="#ff007f"/>
                    <circle cx="60" cy="90" r="5" fill="#e11d48"/>
                    <path d="M57 93 L45 130 L55 130 L60 100 Z" fill="#be123c"/>
                    <path d="M63 93 L75 130 L65 130 L60 100 Z" fill="#be123c"/>
                </g>
            </svg>`;
        }

        const flowerTypes = [getGirasol, getTulipan, getMargarita, getLirio, getOrquidea];

        const canvas = document.getElementById('universe-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [], comets = [];
        const numStars = 800; 
        let starSpeed = 0.2; 
        let warpSpeed = 0;   
        let currentScene = 0; // 0:Start, 1:Seed/Stem, 2:Heart, 3:Slide, 4:Warp, 5:Final
        let isWarping = false;
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() { this.reset(true); }
            reset(randomZ = false) {
                this.x = (Math.random() - 0.5) * width * 2;
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = randomZ ? Math.random() * width : width;
                this.pz = this.z;
                const colors = ['#ffffff', '#fef08a', '#e0f2fe', '#fffbeb', '#ff007f'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.size = Math.random() * 1.5 + 0.5;
            }
            update() {
                this.pz = this.z;
                this.z -= (starSpeed + warpSpeed);
                if (this.z < 1) this.reset();
            }
            draw() {
                let sx = (this.x / this.z) * (width / 2) + width / 2;
                let sy = (this.y / this.z) * (height / 2) + height / 2;
                let px = (this.x / this.pz) * (width / 2) + width / 2;
                let py = (this.y / this.pz) * (height / 2) + height / 2;

                if (warpSpeed > 2) {
                    ctx.beginPath();
                    ctx.moveTo(px, py); ctx.lineTo(sx, sy);
                    ctx.lineWidth = Math.max(1, (1 - this.z / width) * 5);
                    let warpColor = warpSpeed > 30 ? (Math.random() > 0.5 ? '#ff007f' : '#facc15') : this.color;
                    if(warpSpeed > 60) warpColor = '#ffffff'; 
                    ctx.strokeStyle = warpColor; ctx.stroke();
                } else {
                    let radius = Math.max(0.1, (1 - this.z / width) * this.size);
                    ctx.beginPath();
                    ctx.arc(sx, sy, radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color; 
                    
                    if(radius > 1.2) {
                        ctx.shadowBlur = 15; ctx.shadowColor = this.color;
                    } else { ctx.shadowBlur = 0; }
                    ctx.fill();
                    ctx.shadowBlur = 0; 
                }
            }
        }

        class Comet {
            constructor() { this.active = false; }
            spawn() {
                this.active = true;
                this.x = Math.random() * width; this.y = -50;
                this.length = Math.random() * 150 + 100;
                this.speed = Math.random() * 20 + 15;
                this.angle = Math.PI / 4 + (Math.random() * 0.2); 
            }
            update() {
                if(!this.active) {
                    if(Math.random() < 0.003 && !isWarping && currentScene >= 4) this.spawn(); 
                    return;
                }
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                if(this.x > width + this.length || this.y > height + this.length) this.active = false;
            }
            draw() {
                if(!this.active || isWarping) return;
                const tailX = this.x - Math.cos(this.angle) * this.length;
                const tailY = this.y - Math.sin(this.angle) * this.length;
                
                let grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.1, '#facc15'); grad.addColorStop(1, 'transparent');

                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(tailX, tailY);
                ctx.lineWidth = 3; ctx.strokeStyle = grad; ctx.stroke();
            }
        }

        for(let i=0; i<numStars; i++) stars.push(new Star());
        for(let i=0; i<4; i++) comets.push(new Comet());

        function drawConstellations() {
            if(isWarping || currentScene >= 4) return;
            ctx.lineWidth = 0.5; ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            const visibleStars = stars.filter(s => s.z < width/1.5 && s.size > 1.2);
            for(let i=0; i<visibleStars.length; i++) {
                let s1 = visibleStars[i];
                let sx1 = (s1.x / s1.z) * (width / 2) + width / 2;
                let sy1 = (s1.y / s1.z) * (height / 2) + height / 2;
                let connections = 0;
                for(let j=i+1; j<visibleStars.length; j++) {
                    if(connections >= 2) break;
                    let s2 = visibleStars[j];
                    let sx2 = (s2.x / s2.z) * (width / 2) + width / 2;
                    let sy2 = (s2.y / s2.z) * (height / 2) + height / 2;
                    let dist = Math.hypot(sx2 - sx1, sy2 - sy1);
                    if(dist < 120) {
                        ctx.beginPath(); ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.stroke();
                        connections++;
                    }
                }
            }
        }

        function animateCanvas() {
            ctx.fillStyle = isWarping ? `rgba(2, 0, 5, 0.3)` : `#020005`;
            ctx.fillRect(0, 0, width, height);
            
            // Fondo galáctico
            let grd = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width*0.8);
            grd.addColorStop(0, 'rgba(250, 204, 21, 0.08)');
            grd.addColorStop(0.5, 'rgba(255, 0, 127, 0.04)');
            grd.addColorStop(1, 'transparent');
            ctx.fillStyle = grd; ctx.fillRect(0, 0, width, height);

            drawConstellations();
            stars.forEach(s => { s.update(); s.draw(); });
            comets.forEach(c => { c.update(); c.draw(); });
            
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        const parallaxWrapper = document.getElementById('parallax-wrapper');
        let mouseX = 0, mouseY = 0, currentRotX = 0, currentRotY = 0;

        function updateParallax(e) {
            if(isWarping || currentScene < 4) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            mouseX = (clientX / window.innerWidth) * 2 - 1;
            mouseY = (clientY / window.innerHeight) * 2 - 1;
        }

        window.addEventListener('mousemove', updateParallax);
        window.addEventListener('touchmove', updateParallax, {passive: true});

        function animateParallax() {
            if(currentScene >= 4 && !isWarping) {
                let targetRotX = mouseY * -15; let targetRotY = mouseX * 15;
                currentRotX += (targetRotX - currentRotX) * 0.05; currentRotY += (targetRotY - currentRotY) * 0.05;
                parallaxWrapper.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
            }
            requestAnimationFrame(animateParallax);
        }
        animateParallax();

        let audioCtx;
        function initAudio() {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }
        function playGrowSound() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 2);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 1);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2.5);
            osc.start(); osc.stop(audioCtx.currentTime + 2.5);
        }
        function playWarpSound() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(40, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1500, audioCtx.currentTime + 4);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 2);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 5);
            osc.start(); osc.stop(audioCtx.currentTime + 5);
        }

        function startExperience() {
            initAudio();
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                dropSeed();
            }, 1000);
        }

        function dropSeed() {
            currentScene = 1;
            const seed = document.getElementById('seed');
            seed.style.opacity = '1';
            
            // Caída libre hasta el piso
            setTimeout(() => {
                seed.style.top = 'calc(100vh - 25px)';
            }, 100);

            // Al tocar el piso, crece el tallo
            setTimeout(() => {
                seed.style.opacity = '0';
                playGrowSound();
                document.getElementById('stem-container').style.height = '50vh';
                setTimeout(bloomHeart, 2500);
            }, 1600);
        }

        function bloomHeart() {
            currentScene = 2;
            const heartContainer = document.getElementById('heart-container');
            const isMobile = window.innerWidth < 768;
            const numPoints = isMobile ? 80 : 130;
            const maxRadius = Math.min(window.innerWidth, window.innerHeight) * (isMobile ? 0.35 : 0.45);
            
            // Ocultar tallo suavemente
            document.getElementById('stem-container').style.opacity = '0';

            for (let i = 0; i < numPoints; i++) {
                // Ecuación paramétrica de corazón
                const t = (i / numPoints) * Math.PI * 2;
                const rFactor = 17 + (Math.random() - 0.5); 
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                
                // Convertir a píxeles relativos al centro
                const px = (x / rFactor) * maxRadius; 
                const py = (y / rFactor) * maxRadius - (maxRadius * 0.1); 

                const flower = document.createElement('div');
                flower.className = 'flower-item';
                flower.style.left = `calc(50% + ${px}px)`;
                flower.style.top = `calc(50% + ${py}px)`;
                
                const size = isMobile ? (Math.random() * 40 + 40) : (Math.random() * 60 + 50);
                flower.style.width = `${size}px`; flower.style.height = `${size}px`;
                
                const RandomFlowerGen = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];
                flower.innerHTML = RandomFlowerGen("100%");
                heartContainer.appendChild(flower);

                // Brotar una por una
                setTimeout(() => {
                    const slightTilt = (Math.random() - 0.5) * 20; // Al derecho, variación natural
                    flower.style.transform = `translate(-50%, -50%) scale(1) rotate(${slightTilt}deg)`;
                }, i * 40); // 40ms entre cada flor
            }

            // Cuando termine de brotar, pasar a la siguiente escena
            setTimeout(splitScreen, numPoints * 40 + 1000);
        }

        function splitScreen() {
            currentScene = 3;
            const heartContainer = document.getElementById('heart-container');
            const nameContainer = document.getElementById('name-container');
            
            // Mover corazón a la derecha (o arriba)
            heartContainer.classList.add('slide-right-desktop');
            
            // Aparece el nombre a la izquierda (o abajo)
            setTimeout(() => {
                nameContainer.classList.add('active');
            }, 1000);
        }

        function triggerWarp() {
            if(isWarping || currentScene < 3) return;
            currentScene = 4;
            isWarping = true;
            playWarpSound();
            
            // UI desaparece agresivamente
            document.getElementById('name-container').style.opacity = '0';
            const heartContainer = document.getElementById('heart-container');
            heartContainer.style.transform = 'translate(-50%, -50%) scale(10)';
            heartContainer.style.opacity = '0';
            
            let accel = setInterval(() => {
                warpSpeed += 4;
                if(warpSpeed > 180) clearInterval(accel);
            }, 30);

            // Llegada a la galaxia final
            setTimeout(() => {
                const flash = document.getElementById('flash-overlay');
                flash.style.background = 'white'; flash.style.opacity = '1';
                
                let decel = setInterval(() => {
                    warpSpeed -= 15;
                    if(warpSpeed <= 0) {
                        warpSpeed = 0; isWarping = false; clearInterval(decel);
                        heartContainer.innerHTML = ''; // Limpiar RAM
                        showFinalScene();
                        setTimeout(() => flash.style.opacity = '0', 500);
                    }
                }, 20);
            }, 4500);
        }

        const typingTextStr = "Feliz día de las flores amarillas, mi vida. Cada flor amarilla que ves aquí es un latido de mi corazón, así como el sol ilumina los campos, tú iluminas mi vida. Te quiero muchísimo, te quiero millones. Que estas flores te recuerden lo especial que eres para mí. Esto es un pequeño detallito para ti, mi vida.❤️";
        
        const romanticPhrases = [
            "Mi coincidencia favorita 💫", "La dueña de mis sonrisas 😊",
            "Mi magia 🪄", "Eres arte puro 🎨", "Me encantas demasiado 🙈",
            "Flores para mi flor 🌻", "Lo mejor de mi vida 💛",
            "Tú y yo siempre 👫", "Un regalo del cielo ☁️", "Mi lugar favorito 🏡"
        ];
        
        let planetsData = [];

        function showFinalScene() {
            currentScene = 5;
            document.getElementById('final-scene').style.opacity = '1';
            document.getElementById('final-scene').style.pointerEvents = 'auto';
            
            // Iniciar Typewriter
            const textEl = document.getElementById('typing-text');
            let charIdx = 0;
            textEl.innerHTML = '<span class="cursor"></span>';
            let typing = setInterval(() => {
                if(charIdx < typingTextStr.length) {
                    textEl.innerHTML = typingTextStr.substring(0, charIdx + 1) + '<span class="cursor"></span>';
                    charIdx++;
                } else {
                    clearInterval(typing);
                }
            }, 60);

            // Iniciar Timer
            updateTimer();
            setInterval(updateTimer, 1000);

            // Crear Planetas (Frases y Ramos orbitando)
            buildOrbits();
        }

        function updateTimer() {
            // Fecha de inicio: 12 de Abril 2026
            const startDate = new Date('2026-04-12T00:00:00').getTime();
            // Para el propósito del contador, usamos la fecha actual. 
            // Si la fecha actual es anterior al inicio, se mostrará 0.
            const now = Date.now();
            let diff = now - startDate;
            
            if (diff < 0) diff = 0; // Prevenir negativos si estamos testeando antes de fecha

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            const grid = document.getElementById('timer-grid');
            grid.innerHTML = `
                <div class="time-box"><div class="time-value">${days}</div><div class="time-label">Días</div></div>
                <div class="time-box"><div class="time-value">${hours.toString().padStart(2, '0')}</div><div class="time-label">Horas</div></div>
                <div class="time-box"><div class="time-value">${minutes.toString().padStart(2, '0')}</div><div class="time-label">Minutos</div></div>
                <div class="time-box"><div class="time-value">${seconds.toString().padStart(2, '0')}</div><div class="time-label">Segundos</div></div>
            `;
        }

        function buildOrbits() {
            const system = document.getElementById('solar-system');
            const isMobile = window.innerWidth < 768;
            const totalElements = romanticPhrases.length;
            
            romanticPhrases.forEach((text, i) => {
                const el = document.createElement('div');
                el.className = 'planet';
                
                // Asignamos Ramo SVG o Burbuja de texto alternadamente
                if(i % 2 === 0) {
                    el.innerHTML = `<div style="transform: scale(${isMobile? 0.8 : 1.2})">${getRamo("100px")}</div>`;
                } else {
                    el.innerHTML = `<div class="planet-bubble">${text}</div>`;
                }

                system.appendChild(el);
                
                // Cálculos orbitales
                const ringIndex = i % 3; // 3 anillos virtuales
                const baseRx = isMobile ? 180 : 400;
                const baseRy = isMobile ? 100 : 200;
                
                planetsData.push({
                    el: el,
                    angle: (Math.PI * 2 / totalElements) * i,
                    speed: (0.002 + Math.random() * 0.002) * (i % 2 === 0 ? 1 : -1),
                    rx: baseRx + (ringIndex * 80),
                    ry: baseRy + (ringIndex * 40)
                });
            });

            animateOrbits();
        }

        function animateOrbits() {
            if(currentScene !== 5) return;
            
            planetsData.forEach(p => {
                p.angle += p.speed;
                const x = Math.cos(p.angle) * p.rx;
                const y = Math.sin(p.angle) * p.ry;
                const z = Math.sin(p.angle) * 300; // Profundidad Z fuerte para pasar detrás del texto
                
                p.el.style.transform = `translate(-50%, -50%) translate3d(${x}px, ${y}px, ${z}px)`;
                p.el.style.zIndex = Math.floor(z + 500);
                
                // Efecto de atenuación al pasar por detrás
                const brightness = z < 0 ? 0.3 : 1;
                const opacity = z < -100 ? 0.5 : 1;
                p.el.style.filter = `brightness(${brightness})`;
                p.el.style.opacity = opacity;
            });

            requestAnimationFrame(animateOrbits);
        }
    </script>
</body>
